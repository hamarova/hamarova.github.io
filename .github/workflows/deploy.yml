# Automatické zverejnenie webu.
# Po každom pushnutí do vetvy master GitHub web zostaví (Jekyll)
# a hotové stránky uloží do vetvy gh-pages, ktorú zobrazuje hamarova.com.

name: Zverejnenie webu

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zverejnenie:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie súborov
        uses: actions/checkout@v4

      - name: Inštalácia Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Zostavenie webu
        run: |
          bundle install
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Zverejnenie do gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
