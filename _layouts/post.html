---
layout: default
---

<article class="sekcia clanok">
  <span class="popisok">{{ page.date | date: "%Y" }}{% if page.typ %} · {{ page.typ }}{% endif %}</span>
  <h1>{{ page.title }}</h1>
  <div class="clanok-obsah">
    {{ content }}
    {% if page.odkaz %}<p><a href="{{ page.odkaz }}" class="odkaz-sipka">Čítať celý text →</a></p>{% endif %}
  </div>
  <a href="{{ '/' | relative_url }}#publikacie" class="popisok clanok-spat">← Všetky publikácie</a>
</article>
