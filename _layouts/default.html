<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="hlavicka">
  <a href="{{ '/' | relative_url }}" class="popisok">{{ site.title }}</a>
  <nav class="menu popisok">
    <a href="{{ '/' | relative_url }}#expertiza">Expertíza</a>
    <a href="{{ '/' | relative_url }}#profil">Profil</a>
    <a href="{{ '/' | relative_url }}#texty">Texty</a>
    <a href="#kontakt" class="menu-kontakt">Kontakt</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer id="kontakt" class="kontakt">
  <span class="popisok">(06) Kontakt</span>
  <a href="mailto:{{ site.email }}" class="kontakt-vyzva">Napíšte mi →</a>
  <div class="kontakt-riadok popisok">
    <span class="kontakt-odkazy">
      <a href="mailto:{{ site.email }}" class="kontakt-email">{{ site.email }}</a>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </span>
    <span>© {{ site.time | date: '%Y' }}</span>
  </div>
</footer>

</body>
</html>
